name: Windows .exe derle ve Release'e ekle

# Bu iş akışı iki şekilde tetiklenir:
# 1) "v" ile başlayan bir etiket (tag) push edildiğinde (örn. v1.0.0) -> otomatik Release oluşturur ve exe'yi ekler
# 2) GitHub'ın Actions sekmesinden elle "Run workflow" ile çalıştırıldığında -> sadece derler, exe'yi indirilebilir "artifact" olarak bırakır
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: .exe olarak derle
        run: >
          pyinstaller --onefile --windowed
          --name YoutubeTopluYukleme
          --collect-all googleapiclient
          --collect-all google_auth_oauthlib
          --collect-all google_auth_httplib2
          --collect-all google.auth
          gui_upload.py

      - name: Derlenen dosyayı kontrol et
        run: dir dist

      - name: Artifact olarak yükle (her çalıştırmada)
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeTopluYukleme-windows-exe
          path: dist/YoutubeTopluYukleme.exe

      - name: GitHub Release oluştur ve exe'yi ekle (sadece etiket push edildiğinde)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YoutubeTopluYukleme.exe
          generate_release_notes: true
